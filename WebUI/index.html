<!DOCTYPE html>
<html lang="es" data-theme="ms2000">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <script>
    try {
      var s = localStorage.getItem('color-scheme');
      if (s === 'light' || s === 'dark') {
        document.querySelector('meta[name="color-scheme"]').content = s;
      }
    } catch (e) {}
  </script>
  <title>ABDMCX0X -- Groove-Rompler &amp; Hardware Bridge</title>
</head>
<body class="mcx-app abd-theme-bg abd-theme-bg--full">
  <div id="mcx-navbar-host"></div>

  <section class="mcx-lcd-strip">
    <div class="mcx-lcd" aria-live="polite">
      <div class="mcx-lcd-line1" id="lcd-line1">SUPERFREE  |  PART 01  |  64 VOICES</div>
      <div class="mcx-lcd-line2" id="lcd-line2" data-i18n="mcx.lcdReady">LISTO -- TOCA TECLAS O MUEVE MANDOS</div>
    </div>

    <div class="mcx-scope-wrap">
      <canvas id="mcx-scope-canvas" class="mcx-scope-canvas" width="240" height="44"></canvas>
    </div>

    <label class="mcx-select-card" style="min-width: 120px;">
      <span class="mcx-control-label" data-i18n="mcx.masterVol">MASTER</span>
      <input type="range" id="master-volume" min="0" max="1" step="0.01" value="0.85" />
    </label>

    <div class="mcx-voice-meter">
      <span class="mcx-voice-caption" id="voice-caption">0 / 64 VOICES</span>
      <div class="mcx-voice-leds" id="voice-leds"></div>
    </div>
  </section>

  <main class="mcx-workspace">
    <aside class="mcx-panel">
      <div class="mcx-panel-title" data-i18n="mcx.partsTitle">MEZCLADOR 16 PARTES</div>
      <div class="mcx-part-list" id="part-list"></div>
    </aside>

    <section class="mcx-center-col">
      <div class="mcx-tabs-bar" id="center-tabs" role="tablist">
        <button type="button" class="mcx-btn is-active" data-tab="tone" data-i18n="mcx.tabToneFx">TONO Y FX</button>
        <button type="button" class="mcx-btn" data-tab="drums" data-i18n="mcx.tabDrums">DRUM RACK (16 PADS)</button>
      </div>

      <div class="mcx-tab-pane" data-pane="tone">
        <div class="mcx-panel">
          <div class="mcx-panel-title" data-i18n="mcx.deckTitle">TONO Y MACROS EN VIVO</div>
          <div class="mcx-controls-grid" id="macro-deck"></div>
        </div>
        <div class="mcx-panel">
          <div class="mcx-panel-title" data-i18n="mcx.fxTitle">EFECTOS MASTER</div>
          <div class="mcx-selects-grid" id="fx-deck"></div>
        </div>
      </div>

      <div class="mcx-tab-pane is-hidden" data-pane="drums">
        <div class="mcx-panel">
          <div class="mcx-panel-title" data-i18n="mcx.drumRackTitle">DRUM RACK 16 PADS GROOVEBOX (PARTE DRUM ACTIVA)</div>
          <div class="mcx-drum-grid" id="drum-pads"></div>
        </div>
      </div>
    </section>

    <aside class="mcx-panel">
      <div class="mcx-panel-title" data-i18n="mcx.vectorTitle">MORPH VECTORIAL 2D</div>
      <div class="mcx-vector-pad" id="vector-pad">
        <div class="mcx-vector-dot" id="vector-dot"></div>
      </div>
      <div class="mcx-drop-zone" id="bank-drop-zone" data-i18n="mcx.dropBankHint">
        Suelta aquí un archivo .abdbank para cargar el banco
      </div>
      <input type="file" id="bank-file-input" accept=".abdbank" hidden />
    </aside>
  </main>

  <footer class="mcx-keyboard-dock">
    <div class="mcx-kbd-wheels">
      <div id="pitch-wheel-container"></div>
      <div id="mod-wheel-container"></div>
    </div>
    <div class="kbd-octave-controls">
      <button type="button" id="oct-up" class="kbd-octave-btn" title="Octave Up">
        <span>OCT +</span>
        <div class="kbd-octave-led" id="led-up"></div>
      </button>
      <button type="button" id="oct-down" class="kbd-octave-btn" title="Octave Down">
        <span>OCT -</span>
        <div class="kbd-octave-led" id="led-down"></div>
      </button>
    </div>
    <div class="mcx-kbd-host" id="piano-keyboard"></div>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
