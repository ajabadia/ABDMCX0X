<!DOCTYPE html>
<html lang="es" data-theme="ms2000">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <script>
    try {
      var s = localStorage.getItem('color-scheme');
      if (s === 'light' || s === 'dark') {
        document.querySelector('meta[name="color-scheme"]').content = s;
      }
    } catch (e) {}
  </script>
  <title>ABDMCX0X -- Groove-Rompler &amp; Hardware Bridge</title>
</head>
<body class="mcx-app abd-theme-bg abd-theme-bg--full">
  <div id="mcx-navbar-host"></div>

  <section class="mcx-lcd-strip">
    <div class="mcx-lcd" aria-live="polite">
      <div class="mcx-lcd-line1" id="lcd-line1">SUPERFREE  |  PART 01  |  64 VOICES</div>
      <div class="mcx-lcd-line2" id="lcd-line2" data-i18n="mcx.lcdReady">LISTO -- TOCA TECLAS O MUEVE MANDOS</div>
    </div>

    <div class="mcx-scope-wrap">
      <canvas id="mcx-scope-canvas" class="mcx-scope-canvas" width="240" height="44"></canvas>
    </div>

    <div class="mcx-voice-meter">
      <span class="mcx-voice-caption" id="voice-caption">0 / 64 VOICES</span>
      <div class="mcx-voice-leds" id="voice-leds"></div>
    </div>

    <button type="button" class="mcx-global-toggle-btn" id="mcx-global-btn" title="Global & Master Bus Settings" data-i18n-title="mcx.globalBtn">
      <span class="mcx-global-btn-led"></span>
      <span data-i18n="mcx.globalBtn">GLOBAL</span>
    </button>
  </section>

  <!-- 16-BUTTON HARDWARE STRIP (Canonical @abdsynths/shared component) -->
  <section class="mcx-step-strip-host" id="mcx-step-strip-host"></section>

  <!-- SCROLLABLE WORKSPACE (Between 16-Button Strip and Keyboard Dock) -->
  <main class="mcx-workspace" id="mcx-workspace">
    <!-- LEFT PANEL: Morph Vectorial 2D Joystick & Bank Drop Zone -->
    <aside class="mcx-panel mcx-panel--left" id="mcx-left-dock">
      <div class="mcx-panel-title" data-i18n="mcx.vectorTitle">MORPH VECTORIAL 2D</div>
      <div class="mcx-vector-pad" id="vector-pad">
        <div class="mcx-vector-dot" id="vector-dot"></div>
      </div>
      <div class="mcx-drop-zone" id="bank-drop-zone" data-i18n="mcx.dropBankHint">
        Suelta aquí un archivo .abdbank para cargar el banco
      </div>
      <input type="file" id="bank-file-input" accept=".abdbank" hidden />
    </aside>

    <!-- MAIN COLUMN: Horizontal 16-Part Mixer on top, Contextual Tone/Drums on bottom -->
    <section class="mcx-main-col">
      <!-- TOP: 16-Part Console (Horizontal Rack of 16 Vertical Channel Strips) -->
      <section class="mcx-panel mcx-mixer-panel">
        <div class="mcx-panel-title" data-i18n="mcx.partsTitle">MEZCLADOR 16 PARTES</div>
        <div class="mcx-mixer-console" id="part-list"></div>
      </section>
    </section>
  </main>

  <footer class="mcx-keyboard-dock">
    <div class="mcx-kbd-wheels">
      <div id="pitch-wheel-container"></div>
      <div id="mod-wheel-container"></div>
    </div>
    <div class="kbd-octave-controls">
      <button type="button" id="oct-up" class="kbd-octave-btn" title="Octave Up" data-i18n-title="mcx.octaveUp">
        <span data-i18n="mcx.octUpShort">OCT +</span>
        <div class="kbd-octave-led" id="led-up"></div>
      </button>
      <button type="button" id="oct-down" class="kbd-octave-btn" title="Octave Down" data-i18n-title="mcx.octaveDown">
        <span data-i18n="mcx.octDownShort">OCT -</span>
        <div class="kbd-octave-led" id="led-down"></div>
      </button>
    </div>
    <div class="mcx-kbd-host" id="piano-keyboard"></div>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
